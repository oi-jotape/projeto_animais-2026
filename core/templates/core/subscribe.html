<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição - {{ opportunity.title }}</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

    <header class="bg-success text-white py-4 shadow-sm mb-4">
        <div class="container d-flex align-items-center">
            <a href="{% url 'core:index' %}" class="btn btn-outline-light me-3"><i class="bi bi-arrow-left"></i> Voltar</a>
            <h2 class="mb-0">Inscrição para Voluntariado</h2>
        </div>
    </header>

    <main class="container mb-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm border-0 border-top border-success border-4">
                    <div class="card-header bg-white pb-0 border-0 pt-4">
                        <h4 class="card-title text-success">{{ opportunity.title }}</h4>
                        <p class="text-muted"><i class="bi bi-clock"></i> {{ opportunity.schedule }}</p>
                    </div>
                    <div class="card-body">
                        <p class="card-text mb-4">{{ opportunity.description }}</p>
                        
                        <form method="POST">
                            {% csrf_token %}
                            
                            <div class="mb-3">
                                <label for="{{ form.name.id_for_label }}" class="form-label fw-bold">Nome Completo</label>
                                {{ form.name }}
                            </div>
                            
                            <div class="mb-3">
                                <label for="{{ form.email.id_for_label }}" class="form-label fw-bold">E-mail</label>
                                {{ form.email }}
                            </div>
                            
                            <div class="mb-3">
                                <label for="{{ form.phone.id_for_label }}" class="form-label fw-bold">Telefone</label>
                                {{ form.phone }}
                            </div>
                            
                            <div class="mb-4">
                                <label for="{{ form.message.id_for_label }}" class="form-label fw-bold">Mensagem</label>
                                {{ form.message }}
                            </div>

                            <button type="submit" class="btn btn-success w-100 py-2 fw-bold">Confirmar Inscrição</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <div class="container">
            <small>&copy; 2026 Associação de Proteção Animal. Todos os direitos reservados.</small>
        </div>
    </footer>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
